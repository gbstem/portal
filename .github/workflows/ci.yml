name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, type-check, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Corepack must own the `yarn` shim before setup-node's `cache: yarn`
      # probe runs: the probe calls `yarn --version`, and the runner's global
      # Yarn 1.22 refuses to run in a repo pinning "packageManager": "yarn@4.x".
      # setup-node has no pre-cache hook, so it runs twice -- once to put Node
      # on PATH, then again once Corepack is active and the probe detects Berry.
      # The second call re-uses the Node from the first, so it costs ~a second.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn

      - run: yarn install --immutable

      - name: Set up env file
        run: cp .env.example .env.local

      - name: Format check
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn run check

      - name: Unit tests
        run: yarn test

  e2e:
    name: Cypress e2e
    needs: checks
    runs-on: ubuntu-latest
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      FIREBASE_PROJECT_ID: demo-gbstem
      PUBLIC_FIREBASE_PROJECT_ID: demo-gbstem
    steps:
      # Portal and admin share the same Firebase project. Portal's e2e suite
      # reseeds the shared emulator via `cd ../admin && yarn seed` (see
      # cypress/support/e2e.ts and README's Cypress section), so a sibling
      # checkout of admin is required here too.
      - name: Check out portal
        uses: actions/checkout@v7
        with:
          path: portal

      - name: Check out admin (shared Firebase project + seed data)
        uses: actions/checkout@v7
        with:
          repository: gbstem/admin
          path: admin

      # This job checks out two repos side by side, so there is no single
      # project root for setup-node's `cache: yarn` probe to look at -- it runs
      # at the workspace root, which has no package.json and no packageManager
      # field. Rather than fight that, cache the Berry store explicitly. Both
      # repos pin Yarn 4 and leave enableGlobalCache at its Yarn 4 default of
      # true, so they share one directory (~/.yarn/berry/cache) and a single
      # cache entry covers both installs below.
      #
      # This job also had no `corepack enable` step at all, which would have
      # failed both installs against the runner's global Yarn 1.22 regardless
      # of the cache probe.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Locate the shared Yarn Berry cache
        id: yarn-cache
        working-directory: portal
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Restore Yarn cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-berry-${{ runner.os }}-${{ hashFiles('portal/yarn.lock', 'admin/yarn.lock') }}
          restore-keys: yarn-berry-${{ runner.os }}-

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Every `yarn` invocation must run from a directory whose package.json
      # carries the "packageManager" pin. `yarn --cwd portal ...` does NOT:
      # Corepack resolves the Yarn version from the *current* directory, and the
      # workspace root here holds only the two checkouts and no package.json.
      # Corepack therefore fell back to its bundled default of Yarn 1.22.22 and
      # ran a Yarn 1 install, which silently rewrote both yarn.lock files into
      # v1 format (and ignored --immutable). The next step, running from admin/
      # where the pin does apply, then got Yarn 4 and failed on the v1 lockfile
      # with "portal@workspace:. doesn't seem to be present in your lockfile".
      # Use working-directory here, and `cd` inside the emulator script below.
      - name: Install portal dependencies
        working-directory: portal
        run: yarn install --immutable

      - name: Install admin dependencies
        working-directory: admin
        run: yarn install --immutable

      - name: Set up env files
        run: |
          cp portal/.env.example portal/.env.local
          cp admin/.env.example admin/.env.local

      - name: Start dev server + run Cypress against admin's Firebase emulators
        working-directory: admin
        run: |
          firebase emulators:exec --project demo-gbstem \
            '(cd ../portal && yarn dev) & npx wait-on http://localhost:5173 --timeout 60000 && (cd ../portal && yarn cypress)'
